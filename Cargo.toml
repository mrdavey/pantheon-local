[package]
name = "pantheon-local"
version = "0.24.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "swarm"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
hex = "0.4"
nix = { version = "0.30", features = ["signal", "process", "poll"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustix = { version = "1", features = ["fs", "termios"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
signal-hook = "0.3"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = { version = "1.2", default-features = false, features = ["std", "serde", "parse"] }
unicode-width = "0.2"
url = "2"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true
