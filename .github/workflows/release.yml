name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]*'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build release archive
        run: ./scripts/package.sh
      - name: Verify packaged archive
        env:
          SWARM_UPDATE_URL: off
        run: |
          mkdir -p "$RUNNER_TEMP/verify"
          archive=$(ls bin/pantheon-local-*.tar.gz)
          tar -xzf "$archive" -C "$RUNNER_TEMP/verify"
          extracted=$(find "$RUNNER_TEMP/verify" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          (cd "$extracted" && ./tests/e2e && ./tests/experiments)
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            bin/pantheon-local-*.tar.gz
            bin/pantheon-local-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/pantheon-local-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/pantheon-local-* \
              --title "Pantheon Local $GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
