name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: read
jobs:
  qualify:
    if: github.event.deleted == false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build release archive
        run: ./scripts/package.sh
      - name: Verify packaged archive
        run: ./scripts/ci/verify-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            bin/pantheon-local-*.tar.gz
            bin/pantheon-local-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/pantheon-local-* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/pantheon-local-* \
              --title "Pantheon Local $GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes
          fi
