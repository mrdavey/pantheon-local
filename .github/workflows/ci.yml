name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      test_target: ${{ steps.plan.outputs.test_target }}
      platforms: ${{ steps.plan.outputs.platforms }}
      history: ${{ steps.plan.outputs.history }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify release version
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          fi
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' }}
        run: python3 scripts/ci/checks.py plan "$BASE"

  web:
    needs: select
    if: contains(fromJSON(needs.select.outputs.checks), 'web')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: select
        env:
          CHECKS: ${{ needs.select.outputs.checks }}
          HISTORY: ${{ needs.select.outputs.history }}
        run: python3 scripts/ci/checks.py web
      - name: ${{ steps.select.outputs.web }}
        if: steps.select.outputs.run_web == 'true'
        run: |
          npm --prefix web ci
          npm --prefix web run build
          ./scripts/ci/check-web.sh

  rust:
    needs: select
    if: needs.select.outputs.platforms != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    env:
      TEST_TARGET: ${{ needs.select.outputs.test_target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: select
        env:
          CHECKS: ${{ needs.select.outputs.checks }}
          HISTORY: ${{ needs.select.outputs.history }}
        run: python3 scripts/ci/checks.py check
      - name: ${{ steps.select.outputs.fmt || 'Format' }}
        if: steps.select.outputs.run_fmt == 'true'
        run: cargo fmt --check
      - name: ${{ steps.select.outputs.package || 'Release archive' }}
        if: steps.select.outputs.run_package == 'true'
        run: |
          ./scripts/package.sh
          ./scripts/ci/verify-package.sh
      - name: Restore embedded web assets
        id: assets
        if: steps.select.outputs.run_package != 'true' && (steps.select.outputs.run_tests == 'true' || steps.select.outputs.run_lint == 'true' || steps.select.outputs.run_browser == 'true')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: web/dist
          key: ${{ steps.select.outputs.assets }}
      - name: Build embedded web assets
        if: steps.assets.outcome == 'success' && steps.assets.outputs.cache-hit != 'true'
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: ${{ steps.select.outputs.lint || 'Clippy' }}
        if: steps.select.outputs.run_lint == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build CLI and fixtures
        if: steps.select.outputs.run_tests == 'true' || steps.select.outputs.run_browser == 'true'
        run: cargo build --locked --bin swarm --examples
      - name: ${{ steps.select.outputs.tests || 'Rust tests' }}
        if: steps.select.outputs.run_tests == 'true'
        run: |
          if [ -n "$TEST_TARGET" ]; then
            cargo test --locked --test "$TEST_TARGET"
          else
            cargo test --locked
          fi
      - name: Install matching Chrome and ChromeDriver
        if: steps.select.outputs.run_browser == 'true'
        env:
          CHROME_VERSION: '158.0.8127.37'
        run: |
          base="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64"
          for component in chrome chromedriver; do
            curl --fail --silent --show-error --location --retry 3 "$base/$component-linux64.zip" -o "$RUNNER_TEMP/$component.zip"
          done
          unzip -q "$RUNNER_TEMP/chromedriver.zip" -d "$RUNNER_TEMP"
          sudo install -d /opt/pantheon-browser
          sudo unzip -q "$RUNNER_TEMP/chrome.zip" -d /opt/pantheon-browser
          # Ubuntu restricts the user namespaces Chrome uses for its sandbox.
          # Scope the browser profile to the root-owned, pinned test binary.
          sudo apparmor_parser -r <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile pantheon-cft /opt/pantheon-browser/chrome-linux64/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          chrome=/opt/pantheon-browser/chrome-linux64/chrome
          "$chrome" --headless --disable-dev-shm-usage --dump-dom about:blank
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
      - name: ${{ steps.select.outputs.browser || 'Workbench' }}
        if: steps.select.outputs.run_browser == 'true'
        run: cargo test --locked --test workbench -- --ignored --test-threads=1
