name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --examples
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Install matching Chrome and ChromeDriver
        if: runner.os == 'Linux'
        env:
          CHROME_VERSION: '158.0.8127.37'
        run: |
          base="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64"
          for component in chrome chromedriver; do
            curl --fail --silent --show-error --location --retry 3 "$base/$component-linux64.zip" -o "$RUNNER_TEMP/$component.zip"
            unzip -q "$RUNNER_TEMP/$component.zip" -d "$RUNNER_TEMP"
          done
          echo "CHROME_BIN=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=$RUNNER_TEMP/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: cargo test --locked --test workbench -- --ignored --test-threads=1
